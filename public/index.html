<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Gemini</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1> Ask Gemini</h1>

        <p>
            Ask anything and get an AI-powered answer.
        </p>

        <!-- QUESTION INPUT -->
        <input
            type="text"
            id="question"
            placeholder="Enter your question..."
        >

        <!-- FRONTEND POST BUTTON -->
        <button id="submitBtn">
            Ask Gemini
        </button>

        <!-- ANSWER -->
        <div class="answer-box">
            <h2>Answer</h2>

            <p id="answer">
                Your answer will appear here...
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
